# Set `app` to the name you pick with `fly apps create`.
app = "expense-assistant"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/expense.db"
  RUST_LOG = "info"

[http_service]
  internal_port = 8080
  force_https = true
  # Timers and the Gmail poller must keep running: never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "expense_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpus = 1
  cpu_kind = "shared"
